name: Purge jsDelivr cache

# Bij elke push naar main die style.css raakt, purgen we de jsDelivr-cache
# zodat de wijziging direct live staat op alle Webflow-sites.
on:
  push:
    branches:
      - main
    paths:
      - style.css
  workflow_dispatch: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge style.css from jsDelivr
        uses: gacts/purge-jsdelivr-cache@v1
        with:
          url: https://cdn.jsdelivr.net/gh/superrebel/solsbury-shared@main/style.css
